
syntax = "proto3";
import "google/protobuf/empty.proto";
package pd;

// GET
message GetPersonalDataRequest {
    string Id = 1;
}

message GetPersonalDataResponse{
    pd.PersonalDataModel PersonalDataModel = 1;
}

//SET
message SetPersonalDataRequest{
    string Id = 1;
    pd.PersonalDataModel PersonalDataModel = 2;
    string ProcessId = 3;
    string SiteVersion = 4;
    string IpAddress = 5;
}

// GET
message GetOrderPersonalDataRequest {
    string OrderId = 1;
}

message GetOrderPersonalDataResponse{
    pd.OrderPersonalDataModel OrderPersonalDataModel = 1;
}

//SET
message SetOrderPersonalDataRequest{
    string OrderId = 1;
    pd.OrderPersonalDataModel OrderPersonalDataModel = 2;
    string ProcessId = 3;
}

enum AccountType{
    Joint = 0;
    Individual = 1;
    Company = 2;
    IntroducingBroker = 3;
}

enum SexTitle{
    Mr = 0;
    Ms = 1;
    Mrs = 2;
    Mx = 3;
}

message PersonalDataModel {
    optional string Email = 1;
    optional string FirstName = 2;
    optional string LastName = 3;
    optional string City = 4;
    optional int64 DateOfBirth = 5;
    // "CountryOfResidence" is deprecated. Use "CountryOfRegistration" instead.
    optional string CountryOfResidence = 6 [deprecated = true];
    // "CountryOfCitizenship" is deprecated. Use "CountryOfRegistrationByIp" instead.
    optional string CountryOfCitizenship = 7 [deprecated = true];
    optional string ZipCode = 8;
    optional string Phone = 9;
    optional string Address = 10;
    optional pd.SexTitle Sex = 11;
    optional pd.AccountType AccountType = 12;
    optional int64 CreatedDate = 13;
    optional string Region = 14;
    optional string CountryOfRegistration = 15;
    optional string CountryOfRegistrationByIp = 16;
    string Id = 17;
}

message PersonalDataModelWithId {
    string Id = 1;
    pd.PersonalDataModel PersonalDataModel = 2;
}

message OrderPersonalDataModel {
  string ClientId = 2;
  string FirstName = 4;
  string LastName = 5;
  string City = 6;
  string Country = 7;
  string ZipCode = 8;
  string Address = 9;
  string Phone = 10;
}

message GetListRequest {
    uint64 offest = 1;
    uint64 limit = 2;
}

message GetListWithFilterRequest {
    optional string ClientId = 1;
    optional int64 RegistrationDateFrom = 2;
    optional int64 RegistrationDateTo = 3;
    optional string CountryOfRegistration = 4;
    optional string CountryOfRegistrationByIp = 5;
    optional string Phone = 6;
    optional string Email = 7;
    uint64 Offset = 8;
    uint64 Limit = 9;
}

message GetListWithFilterResponse {
    repeated pd.PersonalDataModel Items = 1;
}

message GetListResponse {
    repeated pd.PersonalDataModelWithId Items = 1;
}

message GetForClientsRequest {
    repeated string ClientIds = 1;
}

message GetForClientsResponse {
    repeated pd.PersonalDataModelWithId Items = 1;
}

// PUBLIC PROFILE: how the trader's name appears on certificates and the Trader Card.
// The legal name in PersonalDataModel is never changed by these calls.

enum PublicNameDisplayOption {
    // Default: also returned when the trader never saved the setting.
    FullName = 0;
    FirstNameInitial = 1;
    Nickname = 2;
}

enum NicknameValidationResult {
    Valid = 0;
    Empty = 1;
    TooShort = 2;
    TooLong = 3;
    InvalidCharacters = 4;
    Blocked = 5;
    // Another trader owns it, case-insensitive. The trader's own nickname is Valid.
    Taken = 6;
}

message PublicProfileModel {
    pd.PublicNameDisplayOption DisplayOption = 1;
    // Name shown publicly right now. Null when it cannot be built (no first/last name).
    optional string PublicName = 2;
    // Saved nickname, whatever the selected option is: it stays reserved for the trader.
    optional string Nickname = 3;
    // Null when there is no first and no last name.
    optional string FullNamePreview = 4;
    // Null when there is no first name.
    optional string FirstNameInitialPreview = 5;
}

message GetPublicProfileRequest {
    string ClientId = 1;
}

message GetPublicProfileResponse {
    pd.PublicProfileModel PublicProfile = 1;
}

message ValidateNicknameRequest {
    string ClientId = 1;
    string Nickname = 2;
}

message ValidateNicknameResponse {
    pd.NicknameValidationResult Result = 1;
}

message SetPublicProfileRequest {
    string ClientId = 1;
    pd.PublicNameDisplayOption DisplayOption = 2;
    // Validated only when DisplayOption = Nickname, ignored otherwise.
    optional string Nickname = 3;
}

message SetPublicProfileResponse {
    pd.NicknameValidationResult Result = 1;
    // The saved profile. Present only when Result = Valid.
    optional pd.PublicProfileModel PublicProfile = 2;
}

service PersonalDataService {
    rpc Get(pd.GetPersonalDataRequest) returns (pd.GetPersonalDataResponse);
    rpc Set(pd.SetPersonalDataRequest) returns (google.protobuf.Empty);
    rpc GetList(pd.GetListRequest) returns (pd.GetListResponse);
    rpc GetListWithFilter(pd.GetListWithFilterRequest) returns (pd.GetListWithFilterResponse);

    rpc GetForOrder(pd.GetOrderPersonalDataRequest) returns (pd.GetOrderPersonalDataResponse);
    rpc SetForOrder(pd.SetOrderPersonalDataRequest) returns (google.protobuf.Empty);

    //get for clients
    rpc GetForClients(pd.GetForClientsRequest) returns (pd.GetForClientsResponse);

    //public profile
    rpc GetPublicProfile(pd.GetPublicProfileRequest) returns (pd.GetPublicProfileResponse);
    rpc ValidateNickname(pd.ValidateNicknameRequest) returns (pd.ValidateNicknameResponse);
    rpc SetPublicProfile(pd.SetPublicProfileRequest) returns (pd.SetPublicProfileResponse);

    rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}