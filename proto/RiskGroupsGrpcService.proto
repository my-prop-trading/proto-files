syntax = "proto3";
package risk_groups;

import "google/protobuf/empty.proto";

// ===================== Override sections =====================
// Presence of a section message = "configured" (fully replaces the package
// values for that rule). Absence = fall through to the trading package default.

message ExposureLossOverride {
  bool enabled = 1;            // on/off of the rule itself (may enable a package-disabled rule)
  double soft_breach_cap = 2;
  double hard_breach_cap = 3;
  int32 soft_breach_count = 4;
  int32 timer_secs = 5;
}

message MarginRuleOverride {
  bool enabled = 1;            // on/off of the rule itself
  double soft_cap_percent = 2;
  double hard_cap_percent = 3;
  int32 soft_breach_count = 4;
  double idea_soft_cap_percent = 5;
  double idea_hard_cap_percent = 6;
  int32 idea_soft_breach_count = 7;
  int32 idea_timer_secs = 8;
}

message PayoutOverride {
  double min_amount = 1;
  double max_amount = 2;
  double limit_profit_percent = 3;  // == PayoutSettings.excessive_profit_percent
}

// ===================== Entities =====================

message RiskGroup {
  string id = 1;                          // empty on create
  string name = 2;                        // unique
  string description = 3;
  ExposureLossOverride exposure_loss = 4; // absent = section not configured
  MarginRuleOverride margin_rule = 5;     // absent = section not configured
  PayoutOverride payout = 6;              // absent = section not configured
  int64 created_at = 7;
  int64 updated_at = 8;
  int32 assigned_count = 9;               // derived (for "Users assigned" column); ignored on write
}

message RiskGroupAssignment {
  string id = 1;
  string client_id = 2;
  string risk_group_id = 3;
  string assigned_by = 4;
  int64 assigned_at = 5;
}

// Resolved overrides for a single client. Each section absent = not overridden
// (caller uses the trading package default for that rule).
message RiskOverride {
  ExposureLossOverride exposure_loss = 1;
  MarginRuleOverride margin_rule = 2;
  PayoutOverride payout = 3;
  string risk_group_id = 4;               // empty if the client is in no group
}

// ===================== Errors =====================
// On success the `error` field of a response is absent (None). On failure it is
// set and the payload field is left at its default.

enum RiskGroupsError {
  RISK_GROUPS_ERROR_UNKNOWN = 0;
  RISK_GROUPS_ERROR_GROUP_NOT_FOUND = 1;
  RISK_GROUPS_ERROR_NAME_ALREADY_EXISTS = 2;
  RISK_GROUPS_ERROR_GROUP_HAS_ASSIGNMENTS = 3;   // delete blocked while users assigned
  RISK_GROUPS_ERROR_ASSIGNMENT_NOT_FOUND = 4;
  RISK_GROUPS_ERROR_INVALID_OVERRIDE = 5;        // validation (e.g. hard cap <= soft cap)
  RISK_GROUPS_ERROR_ABUSE_RULE_NOT_FOUND = 6;
  RISK_GROUPS_ERROR_INVALID_ABUSE_RULE = 7;      // validation (e.g. zero window or limit)
  RISK_GROUPS_ERROR_ABUSE_RESTRICTION_NOT_FOUND = 8;
  RISK_GROUPS_ERROR_INVALID_ABUSE_KEY = 9;       // key value is not parsable into a counter key
}

message RiskGroupsErrorWithMessage {
  RiskGroupsError error = 1;
  string message = 2;
}

// ===================== Group management =====================

message GetGroupsRequest {}

message GetGroupsResponse {
  repeated RiskGroup groups = 1;
}

message GetGroupRequest {
  string id = 1;
}

message GetGroupResponse {
  RiskGroup group = 1;                    // absent on error
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

message SetGroupRequest {
  RiskGroup group = 1;  // id empty = create, id set = update
}

message SetGroupResponse {
  RiskGroup group = 1;                    // the saved group; absent on error
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {
  bool deleted = 1;
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

// ===================== Assignment management =====================

message GetAssignmentsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  repeated string risk_group_ids = 3;  // optional filter
}

message GetAssignmentsResponse {
  repeated RiskGroupAssignment assignments = 1;
}

// Assigns a client to a group. One group per client — replaces the existing
// assignment if the client already belongs to a group.
message AssignUserRequest {
  string client_id = 1;
  string risk_group_id = 2;
  string assigned_by = 3;
}

message AssignUserResponse {
  RiskGroupAssignment assignment = 1;     // absent on error
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

message RemoveAssignmentRequest {
  string client_id = 1;
}

message RemoveAssignmentResponse {
  bool removed = 1;
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

// ===================== Resolution (internal) =====================

message GetRiskOverrideRequest {
  string client_id = 1;
}

message GetRiskOverrideResponse {
  RiskOverride override = 1;  // absent = client is in no group
}

// ===================== Anti-abuse =====================
// Velocity rules over registration-class events. Unrelated to the trading risk
// above: it gates an action by request key (IP), not an account by its risk group.

enum AbuseEventType {
  ABUSE_EVENT_TYPE_UNKNOWN = 0;
  ABUSE_EVENT_TYPE_REGISTRATION = 1;
}

// User agent is deliberately absent: rotating it costs an attacker one line of
// code, so it is stored as review evidence but never keys a counter.
enum AbuseKeyType {
  ABUSE_KEY_TYPE_UNKNOWN = 0;
  ABUSE_KEY_TYPE_IP = 1;
}

enum AbuseRuleMode {
  ABUSE_RULE_MODE_BLOCK = 0;
  ABUSE_RULE_MODE_FLAG_FOR_REVIEW = 1;  // restriction is recorded but nothing is gated
}

// Rules on the same event type combine with OR.
message AbuseRule {
  string id = 1;                   // empty on create
  AbuseEventType event_type = 2;
  AbuseKeyType key_type = 3;
  int32 window_secs = 4;
  int32 limit_count = 5;           // restriction triggers when the counter reaches it
  int32 restriction_secs = 6;
  AbuseRuleMode mode = 7;
  bool enabled = 8;
  string comment = 9;
  int64 updated_at = 10;
  string updated_by = 11;
}

message AbuseRestriction {
  AbuseKeyType key_type = 1;
  string key_value = 2;            // normalized counter key: `v4_1.2.3.4` / `v6_2a01cb0812345678`
  string rule_id = 3;
  AbuseRuleMode mode = 4;
  int64 restricted_until = 5;
  int32 triggered_count = 6;       // counter snapshot at trigger time
  int32 window_secs = 7;
  int64 created_at = 8;
  int64 released_at = 9;           // 0 = never released by hand
  string released_by = 10;
}

message AbuseAllowlistEntry {
  AbuseKeyType key_type = 1;
  string key_value = 2;
  string comment = 3;
  int64 created_at = 4;
  string created_by = 5;
}

message AbuseEvent {
  string id = 1;
  AbuseEventType event_type = 2;
  int64 occurred_at = 3;
  string client_id = 4;
  string ip = 5;                   // as resolved by the producer, before normalization
  string user_agent = 6;
  string brand = 7;
  string country = 8;
  string channel = 9;
}

// ----- Rule management -----

message GetAbuseRulesRequest {}

message GetAbuseRulesResponse {
  repeated AbuseRule rules = 1;
}

message SetAbuseRuleRequest {
  AbuseRule rule = 1;  // id empty = create, id set = update
}

message SetAbuseRuleResponse {
  AbuseRule rule = 1;                     // the saved rule; absent on error
  RiskGroupsErrorWithMessage error = 2;   // absent on success
}

message DeleteAbuseRuleRequest {
  string id = 1;
}

message DeleteAbuseRuleResponse {
  bool deleted = 1;
  RiskGroupsErrorWithMessage error = 2;
}

// ----- Restrictions -----

message GetAbuseRestrictionsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  bool active_only = 3;  // still within restricted_until and not released
}

message GetAbuseRestrictionsResponse {
  repeated AbuseRestriction restrictions = 1;
}

message ReleaseAbuseRestrictionRequest {
  AbuseKeyType key_type = 1;
  string key_value = 2;
  string released_by = 3;
}

message ReleaseAbuseRestrictionResponse {
  bool released = 1;
  RiskGroupsErrorWithMessage error = 2;
}

// ----- Allowlist -----

message GetAbuseAllowlistRequest {}

message GetAbuseAllowlistResponse {
  repeated AbuseAllowlistEntry entries = 1;
}

// `key_value` is accepted raw (a plain IP) and normalized into a counter key
// server-side, so that the operator does not have to know the key format.
message SetAbuseAllowlistEntryRequest {
  AbuseKeyType key_type = 1;
  string key_value = 2;
  string comment = 3;
  string created_by = 4;
}

message SetAbuseAllowlistEntryResponse {
  AbuseAllowlistEntry entry = 1;
  RiskGroupsErrorWithMessage error = 2;
}

message DeleteAbuseAllowlistEntryRequest {
  AbuseKeyType key_type = 1;
  string key_value = 2;
}

message DeleteAbuseAllowlistEntryResponse {
  bool deleted = 1;
  RiskGroupsErrorWithMessage error = 2;
}

// ----- Events -----

// Either by counter key (review queue) or by client (the client card block).
message GetAbuseEventsRequest {
  AbuseKeyType key_type = 1;
  string key_value = 2;   // ignored when client_id is set
  string client_id = 3;
  uint32 limit = 4;
  uint32 offset = 5;
}

message GetAbuseEventsResponse {
  repeated AbuseEvent events = 1;
}

service RiskGroupsGrpcService {
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc SetGroup(SetGroupRequest) returns (SetGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  rpc GetAssignments(GetAssignmentsRequest) returns (GetAssignmentsResponse);
  rpc AssignUser(AssignUserRequest) returns (AssignUserResponse);
  rpc RemoveAssignment(RemoveAssignmentRequest) returns (RemoveAssignmentResponse);

  rpc GetRiskOverride(GetRiskOverrideRequest) returns (GetRiskOverrideResponse);

  rpc GetAbuseRules(GetAbuseRulesRequest) returns (GetAbuseRulesResponse);
  rpc SetAbuseRule(SetAbuseRuleRequest) returns (SetAbuseRuleResponse);
  rpc DeleteAbuseRule(DeleteAbuseRuleRequest) returns (DeleteAbuseRuleResponse);

  rpc GetAbuseRestrictions(GetAbuseRestrictionsRequest) returns (GetAbuseRestrictionsResponse);
  rpc ReleaseAbuseRestriction(ReleaseAbuseRestrictionRequest) returns (ReleaseAbuseRestrictionResponse);

  rpc GetAbuseAllowlist(GetAbuseAllowlistRequest) returns (GetAbuseAllowlistResponse);
  rpc SetAbuseAllowlistEntry(SetAbuseAllowlistEntryRequest) returns (SetAbuseAllowlistEntryResponse);
  rpc DeleteAbuseAllowlistEntry(DeleteAbuseAllowlistEntryRequest) returns (DeleteAbuseAllowlistEntryResponse);

  rpc GetAbuseEvents(GetAbuseEventsRequest) returns (GetAbuseEventsResponse);

  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
