syntax = "proto3";
package shared_cards;
import "google/protobuf/empty.proto";

enum SharedCardPeriodType {
  Week = 0;
  Month = 1;
}

// One calendar cell. Days with no closed trades are not sent.
message SharedCardDay {
  int64 date = 1; // unix microseconds, UTC midnight
  uint32 trades = 2;
  double pnl = 3;
}

// Frozen at share time: the public page always renders these numbers, never live ones.
// The period end is not carried: it follows from period_type + period_start, and a second
// source for it could only ever drift.
message SharedCardSnapshot {
  shared_cards.SharedCardPeriodType period_type = 1;
  int64 period_start = 2; // unix microseconds, UTC midnight (Monday / 1st of month)
  double pnl = 3;
  uint32 trades = 4;
  uint32 trading_days = 5;
  double best_day_pnl = 6;
  double worst_day_pnl = 7;
  string trader_name = 8;
  string account_label = 9;
  string currency = 10;
  repeated shared_cards.SharedCardDay days = 11;
}

message SharedCard {
  string id = 1;
  string client_id = 2;
  string trader_account_id = 3;
  int64 created_at = 4;
  shared_cards.SharedCardSnapshot snapshot = 6;
  // Both formatted server-side, so the page never repeats the date arithmetic or the money
  // formatting, and two cards of the same period always read the same.
  string period_label = 7;
  string pnl_label = 8;
}

message CreateSharedCardRequest {
  string client_id = 1;
  string trader_account_id = 2;
  shared_cards.SharedCardSnapshot snapshot = 3;
}

// Only the id: the page lives in the frontend, so the frontend owns its route and composes
// the link. A path spelled out here could only drift from the page it points at.
message CreateSharedCardResponse {
  string id = 1;
}

message GetSharedCardRequest { string id = 1; }

message GetSharedCardResponse { shared_cards.SharedCard card = 1; }

// The card is data only: the page and its og:image are rendered by the frontend, so nothing
// here knows how a card looks.
service SharedCardsGrpcService {
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc CreateSharedCard(shared_cards.CreateSharedCardRequest) returns (shared_cards.CreateSharedCardResponse);
  rpc GetSharedCard(shared_cards.GetSharedCardRequest) returns (shared_cards.GetSharedCardResponse);
}
