syntax = "proto3";
package rewards;
import "google/protobuf/empty.proto";

enum TaskStatusGrpc {
  AVAILABLE = 0;
  IN_PROGRESS = 1;
  UNDER_REVIEW = 3;
  APPROVED = 2;
  REJECTED = 4;
}

// Lifecycle ladder — cumulative: PaidOut implies Funded implies Purchased implies Everyone.
// Used as a task's required eligibility stage and as a user's highest reached milestone.
enum EligibilityStageGrpc {
  EVERYONE = 0;   // registered account (default)
  PURCHASED = 1;  // at least one pay-in ever (any order, including zero-price grants)
  FUNDED = 2;     // ever earned a LIVE (funded) account
  PAID_OUT = 3;   // ever received an approved payout
}

// Projection of a task's unmet requirement onto a user-facing lock reason.
// Distinct axis from EligibilityStageGrpc: there is no Everyone reason,
// because an Everyone task can never be locked.
enum TaskLockReasonGrpc {
  NEEDS_PURCHASE = 0;
  NEEDS_FUNDED = 1;
  NEEDS_PAYOUT = 2;
}

// Page ordering for GetTasksPage. Left unset the storage default order is kept.
enum TaskSortGrpc {
  SUBMITTED_AT_DESC = 0;
  SUBMITTED_AT_ASC = 1;
}

enum RewardStatusGrpc {
  REWARD_AVAILABLE = 0;
  REWARD_CLAIMED = 1;
  REWARD_PENDING = 2;
  REWARD_FULFILLED = 3;
}

enum RewardTypeGrpc {
  DISCOUNT = 0;
  FREE_CHALLENGE = 1;
}

enum RewardAttributeGrpc {
  DISCOUNT_CODE = 0;
  CHALLENGE_ID = 1;
}

message RewardGrpcModel {
  string Id = 1;
  string IconUrl = 2;
  double RequiredPoints = 3;
  string Name = 4;
  string Description = 5;
  optional string ClientId = 6;
  int64 CreatedAt = 7;
  int64 UpdatedAt = 8;
  optional int64 ExpireDate = 9;
  optional string ParentId = 10;
  RewardTypeGrpc Type = 11;
  map<int32, string> Attributes = 12;
  RewardStatusGrpc status = 13;
  string ManagerId = 14;
}

message DiscountAttributes {
  string Code = 1;
}

message FreeChallengeAttributes {
  string ChallengeId = 1;
}

message GetRewardsPageGrpcRequest {
  int32 Limit = 1;
  int32 Offset = 2;
  optional string ClientId = 3;
  repeated RewardTypeGrpc Types = 4;
  repeated RewardStatusGrpc Statuses = 5;
}

message GetRewardsPageGrpcResponse {
  repeated RewardGrpcModel items = 1;
}

message TaskGrpcModel {
  string Id = 1;
  string IconUrl = 2;
  double RewardPoints = 3;
  string Name = 4;
  string Description = 5;
  int64 CreatedAt = 6;
  int64 UpdatedAt = 7;
  optional string ClientId = 8;
  optional int64 ExpireDate = 9;
  TaskStatusGrpc Status = 10;
  string ManagerId = 11;
  optional string ParentId = 12;
  optional string ScreenshotFileId = 13;
  // Eligibility gate required to submit this task. Set in backoffice, default Everyone.
  EligibilityStageGrpc RequiredStage = 14;
  // Computed per client_id in GetTasksPage only: the unmet requirement, or unset when eligible.
  // Left unset by every other RPC.
  optional TaskLockReasonGrpc LockReason = 15;
  // Screenshot upload time, set on every submit. Unset for tasks nobody submitted yet.
  optional int64 SubmittedAt = 16;
}

message GetTasksPageGrpcRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional string ClientId = 3;
  repeated TaskStatusGrpc statuses = 4;
  optional TaskSortGrpc Sort = 5;
}

message GetTasksPageGrpcResponse {
  repeated TaskGrpcModel items = 1;
}

message BalanceGrpcModel {
  string ClientId = 1;
  double AvailablePoints = 2;
  int64 CreatedAt = 3;
  int64 UpdatedAt = 4;
}

message GetBalanceGrpcRequest {
  string ClientId = 1;
}

message GetBalanceGrpcResponse {
  BalanceGrpcModel item = 1;
}

message UpdateBalanceGrpcRequest {
  string ClientId = 1;
  double AvailablePoints = 2;
  string ManagerId = 3;
}

message UpdateBalanceGrpcResponse {
  BalanceGrpcModel item = 1;
}

message SubmitTaskGrpcRequest {
  string ClientId = 1;
  string TaskId = 2;
  FileGrpcModel Screenshot = 3;
}

message SubmitTaskGrpcResponse {
  optional string ErrorMessage = 1;
  optional TaskGrpcModel Item = 2;
}

message ClaimRewardGrpcRequest {
  string ClientId = 1;
  string RewardId = 2;
}

message ClaimRewardGrpcResponse {
  optional string ErrorMessage = 1;
  optional RewardGrpcModel Item = 2;
}

message ApproveTaskGrpcRequest {
  string ManagerId = 1;
  string TaskId = 2;
  string ClientId = 3;
}

message ApproveTaskGrpcResponse {
  optional string ErrorMessage = 1;
  optional TaskGrpcModel Item = 2;
}

message CreateOrUpdateRewardsGrpcRequest {
  repeated RewardGrpcModel Items = 1;
}

message CreateOrUpdateRewardsGrpcResponse {
}

message CreateOrUpdateTasksGrpcRequest {
  repeated TaskGrpcModel Items = 1;
}

message CreateOrUpdateTasksGrpcResponse {
}

message DeleteTaskGrpcRequest {
  string Id = 1;
}

message DeleteTaskGrpcResponse {
}

message DeleteRewardGrpcRequest {
  string Id = 1;
}

message DeleteRewardGrpcResponse {
}

message RejectTaskGrpcRequest {
  string Id = 1;
  string ManagerId = 2;
}

message RejectTaskGrpcResponse {
  optional TaskGrpcModel Item = 1;
}

message GetTaskScreenshotGrpcRequest {
  string Id = 1;
}

message GetTaskScreenshotGrpcResponse {
  FileGrpcModel Screenshot = 1;
}

message FileGrpcModel {
  bytes ContentBytes = 1;
  string Name = 2;
  string ContentType = 3;
}

message FulfillRewardGrpcRequest {
  string Id = 1;
  string ManagerId = 2;
}

message FulfillRewardGrpcResponse {
  optional string ErrMessage = 1;
  optional RewardGrpcModel Item = 2;
}

service RewardsGrpcService {
    rpc GetRewardsPage(GetRewardsPageGrpcRequest) returns (GetRewardsPageGrpcResponse);
    rpc CreateOrUpdateRewards(CreateOrUpdateRewardsGrpcRequest) returns (CreateOrUpdateRewardsGrpcResponse);
    rpc DeleteReward(DeleteRewardGrpcRequest) returns (DeleteRewardGrpcResponse);
    rpc ClaimReward(ClaimRewardGrpcRequest) returns (ClaimRewardGrpcResponse);
    rpc FulfillReward(FulfillRewardGrpcRequest) returns (FulfillRewardGrpcResponse);

    rpc GetTasksPage(GetTasksPageGrpcRequest) returns (GetTasksPageGrpcResponse);
    rpc CreateOrUpdateTasks(CreateOrUpdateTasksGrpcRequest) returns (CreateOrUpdateTasksGrpcResponse);
    rpc SubmitTask(SubmitTaskGrpcRequest) returns (SubmitTaskGrpcResponse);
    rpc DeleteTask(DeleteTaskGrpcRequest) returns (DeleteTaskGrpcResponse);
    rpc ApproveTask(ApproveTaskGrpcRequest) returns (ApproveTaskGrpcResponse);
    rpc RejectTask(RejectTaskGrpcRequest) returns (RejectTaskGrpcResponse);
    rpc GetTaskScreenshot(GetTaskScreenshotGrpcRequest) returns (GetTaskScreenshotGrpcResponse);

    rpc GetBalance(GetBalanceGrpcRequest) returns (GetBalanceGrpcResponse);
    rpc UpdateBalance(UpdateBalanceGrpcRequest) returns (UpdateBalanceGrpcResponse);

    rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
