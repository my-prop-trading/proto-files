syntax = "proto3";
package live_payouts;

import "google/protobuf/empty.proto";

// Live-payouts: fake weekly payout feed generation for the Discord showcase
// (PROP25-2472, epic PROP25-2458). This contract covers the BO surface for the
// settings page and the Draft page (spec steps 1 & 3). Publication / общая таблица
// / Discord / real payouts are a later ticket.
service LivePayoutsFlowsGrpcService {
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);

  // ── Settings page ─────────────────────────────────────────────────────────
  // The currently active settings snapshot (renders the form). Absent = none saved.
  rpc GetActiveSettings(google.protobuf.Empty) returns (GetActiveSettingsResponse);
  // Append-only version history (who/when), newest first.
  rpc GetSettingsHistory(google.protobuf.Empty) returns (GetSettingsHistoryResponse);
  // Save a new settings version. Validated server-side BEFORE insert; an invalid
  // snapshot is rejected (shares must sum to 100%, amount ranges non-overlapping and
  // covering the total, ≥1 package). Activates the new version (CAS on is_active).
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsResponse);
  // The full package list from TraderPackagesGrpcService.GetAll (published +
  // unpublished) — the choices for the settings package table. Never hardcoded.
  rpc GetAvailablePackages(google.protobuf.Empty) returns (GetAvailablePackagesResponse);
  // Countries the name engine can generate names for — the ONLY valid choices for
  // the tier country lists, so a payout never lands on a country with no name
  // morphology (PROP25-2472). The settings dropdown is built from this.
  rpc GetSupportedCountries(google.protobuf.Empty) returns (GetSupportedCountriesResponse);

  // ── Draft page ────────────────────────────────────────────────────────────
  // Weeks currently in Draft/InvalidDraft (list with status + report + summary).
  rpc GetDraftWeeks(google.protobuf.Empty) returns (GetDraftWeeksResponse);
  // Confirmed weeks — the shared payouts table (spec §3.2). Same shape as
  // GetDraftWeeks; a Draft leaves here after ConfirmWeek. Certificate/Discord
  // columns are a later ticket (step 4).
  rpc GetConfirmedWeeks(google.protobuf.Empty) returns (GetDraftWeeksResponse);
  // Rows of one week (chronological), for the day-by-day view.
  rpc GetWeekRows(GetWeekRowsRequest) returns (GetWeekRowsResponse);
  // Run generation by hand (spec §2 kick button). generated_by = the BO user.
  rpc RunGeneration(RunGenerationRequest) returns (RunGenerationResponse);
  // Regenerate a whole week in place (reuses the week row, replaces its rows).
  rpc RegenerateWeek(RegenerateWeekRequest) returns (RegenerateWeekResponse);
  // Regenerate a single row of a Draft week.
  rpc RegenerateRow(RegenerateRowRequest) returns (RowResponse);
  // Confirm a week — whole week (row_ids empty) or specific rows.
  rpc ConfirmWeek(ConfirmWeekRequest) returns (ConfirmWeekResponse);
  // Edit any field of a Draft row.
  rpc UpdateRow(UpdateRowRequest) returns (RowResponse);
  // Add a row by hand (spec §3.1).
  rpc AddRow(AddRowRequest) returns (RowResponse);
  // Delete a Draft row.
  rpc DeleteRow(DeleteRowRequest) returns (google.protobuf.Empty);
  // Exclude / un-exclude a row (spec §3: an excluded row never publishes but stays
  // in history). Toggles row_status Excluded⇄Draft.
  rpc SetRowExcluded(SetRowExcludedRequest) returns (RowResponse);

  // ── Publication (spec §4, PROP25-2473) ────────────────────────────────────
  // Publication settings (window, weekdays, retry policy, pause). Absent row =
  // returns the defaults.
  rpc GetPublicationSettings(google.protobuf.Empty) returns (GetPublicationSettingsResponse);
  // Save the publication settings (window/weekdays/retry). Validated server-side.
  rpc SavePublicationSettings(SavePublicationSettingsRequest) returns (GetPublicationSettingsResponse);
  // Pause / resume all publication without touching rows (spec §4).
  rpc SetPublicationPaused(SetPublicationPausedRequest) returns (GetPublicationSettingsResponse);
  // Manual "retry" on a failed row (spec §4): clears the Error mark(s) and resets
  // the retry counter so the timer picks the row up again.
  rpc RetryRow(RetryRowRequest) returns (RowResponse);
  // Manual "post now" on a row (PROP25-2473): publish it immediately (certificate →
  // Discord) ignoring both publish_at and the publish window, for an out-of-band or
  // stuck row — no DB aging needed. Still idempotent on the marks (an already-issued
  // certificate / already-sent message is not repeated) and skips excluded rows.
  rpc PublishRowNow(PublishRowNowRequest) returns (RowResponse);
}

// ── Enums (numbers frozen) ────────────────────────────────────────────────────

enum WeekStatus {
  Draft = 0;
  Confirmed = 1;
  Expired = 2;
  InvalidDraft = 3;
}

enum RowStatus {
  RowDraft = 0;      // prefixed — proto3 enum values share the package namespace
  RowConfirmed = 1;
  RowExcluded = 2;
}

// ── Settings messages ──────────────────────────────────────────────────────────

// Mirrors postgres::snapshot shapes. Money in cents; shares/dispersion in permille.
message VolumeSettings {
  int64 total_min_cents = 1;
  int64 total_max_cents = 2;
  uint32 min_week_diff_permille = 3;
  // Target average-payout band (PROP25-2472): drives the derived row count and,
  // with the package ranges, whether a week is generatable. A setting, not a
  // hardcoded constant, so it is one source of truth with the packages.
  int64 avg_min_cents = 4;
  int64 avg_max_cents = 5;
}

message PackageSetting {
  string trading_package_id = 1;
  uint32 share_permille = 2;
  int64 amount_min_cents = 3;
  int64 amount_max_cents = 4;
}

message CountryWeight {
  string code = 1;
  uint32 weight = 2;
}

message CountrySettings {
  repeated CountryWeight tier1 = 1;
  repeated CountryWeight tier2 = 2;
  repeated CountryWeight tier3 = 3;
  uint32 tier4_countries_per_week = 4;
  uint32 tier4_rows_per_country = 5;
  // Tier-4 country list (PROP25-2472): tier 4 draws from these, not a hardcoded
  // pool, so every tier-4 country is one the name engine supports.
  repeated CountryWeight tier4 = 6;
}

message GenerationSettings {
  VolumeSettings volume = 1;
  repeated PackageSetting packages = 2;
  CountrySettings countries = 3;
}

message SettingsVersion {
  string id = 1;
  int64 version = 2;
  bool is_active = 3;
  string changed_by = 4;
  optional string change_note = 5;
  int64 created_at = 6; // unix micros
  GenerationSettings settings = 7;
}

message GetActiveSettingsResponse {
  optional SettingsVersion active = 1; // absent = nothing configured yet
}

message GetSettingsHistoryResponse {
  repeated SettingsVersion versions = 1;
}

message SaveSettingsRequest {
  GenerationSettings settings = 1;
  string changed_by = 2;
  optional string change_note = 3;
}

message SaveSettingsResponse {
  bool ok = 1;
  // On ok=false: human-readable validation errors (shares≠100%, overlap, …).
  repeated string validation_errors = 2;
  optional SettingsVersion saved = 3; // present on ok=true
}

// A package from GetAll, reduced to what the BO table shows.
message AvailablePackage {
  string id = 1;
  string title = 2;
  string label = 3;
  string group_name = 4;
  double account_balance = 5;
}

message GetAvailablePackagesResponse {
  repeated AvailablePackage packages = 1;
}

message SupportedCountry {
  string code = 1; // ISO 3166-1 alpha-2
  string name = 2; // display name
}

message GetSupportedCountriesResponse {
  repeated SupportedCountry countries = 1;
}

// ── Draft messages ───────────────────────────────────────────────────────────

// Summary shown next to a week (spec §3.1): totals, rows/day, per-package share.
message PackageStat {
  string trading_package_id = 1;
  uint32 row_count = 2;
  uint32 actual_permille = 3;
  uint32 target_permille = 4;
}

message WeekSummary {
  int64 total_cents = 1;
  uint32 row_count = 2;
  repeated uint32 rows_per_day = 3; // 5 entries, Mon..Fri
  uint32 unique_surnames = 4;
  uint32 round_count = 5;
  repeated PackageStat package_stats = 6;
}

message PayoutWeek {
  string id = 1;
  int64 week_start = 2; // unix micros
  int64 week_end = 3;
  WeekStatus status = 4;
  string settings_version_id = 5;
  int64 target_total_cents = 6;
  bool is_valid = 7;
  optional string generated_by = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  // Full validation report JSON (findings + summary), as stored. The client can
  // render findings; `summary` is the parsed convenience copy.
  string validation_report_json = 11;
  WeekSummary summary = 12;
  // Seeded history week (imported prior channel weeks), not one this service
  // generated/confirmed. Lets the payouts table mark history vs. real confirmed
  // weeks (PROP25-2472).
  bool is_seed = 13;
  // Actual number of payout rows in this week, counted from the rows table (not
  // from the validation report — seed weeks have no report). For the week-list
  // "Rows" column without expanding the week.
  int32 row_count = 14;
}

message PayoutRow {
  string id = 1;
  string week_id = 2;
  string name = 3;
  string surname = 4;
  string country_code = 5;
  string country_name = 6;
  int64 amount_cents = 7;
  string trading_package_id = 8;
  int64 publish_at = 9; // unix micros
  bool is_real = 10;
  RowStatus row_status = 11;
  // Service fields (empty in Draft; filled at publication — later ticket).
  optional int32 certificate_status = 12;
  optional string certificate_url = 13;
  optional int32 discord_status = 14;
  optional string discord_url = 15;
  optional int32 retry_count = 16;
  optional string last_error = 17;
  optional int64 last_attempt_at = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
}

message GetDraftWeeksResponse {
  repeated PayoutWeek weeks = 1;
}

message GetWeekRowsRequest {
  string week_id = 1;
}

message GetWeekRowsResponse {
  optional PayoutWeek week = 1;
  repeated PayoutRow rows = 2;
}

message RunGenerationRequest {
  string generated_by = 1;
}

// Outcome mirrors bg::FlowOutcome.
enum GenerationOutcome {
  Generated = 0;
  SkippedExists = 1;
  NoSettings = 2;
  Invalid = 3;
}

message RunGenerationResponse {
  GenerationOutcome outcome = 1;
  optional string week_id = 2;   // present when Generated
  optional bool is_valid = 3;    // present when Generated
  optional string message = 4;   // present when Invalid
}

message RegenerateWeekRequest {
  string week_id = 1;
  string requested_by = 2;
}

message RegenerateWeekResponse {
  bool ok = 1;
  bool is_valid = 2;
  optional string message = 3;
}

message RegenerateRowRequest {
  string row_id = 1;
  string requested_by = 2;
}

message ConfirmWeekRequest {
  string week_id = 1;
  // Empty = confirm the whole week; otherwise only these rows (spec §3.1).
  repeated string row_ids = 2;
  string confirmed_by = 3;
}

message ConfirmWeekResponse {
  bool ok = 1;
  uint32 confirmed_rows = 2;
  optional string message = 3;
}

// Editable fields of a Draft row. Absent field = leave unchanged.
message UpdateRowRequest {
  string row_id = 1;
  string changed_by = 2;
  optional string name = 3;
  optional string surname = 4;
  optional string country_code = 5;
  optional int64 amount_cents = 6;
  optional string trading_package_id = 7;
  optional int64 publish_at = 8;
}

message AddRowRequest {
  string week_id = 1;
  string added_by = 2;
  string name = 3;
  string surname = 4;
  string country_code = 5;
  int64 amount_cents = 6;
  string trading_package_id = 7;
  int64 publish_at = 8;
}

message DeleteRowRequest {
  string row_id = 1;
  string deleted_by = 2;
}

message SetRowExcludedRequest {
  string row_id = 1;
  string changed_by = 2;
  bool excluded = 3; // true → Excluded, false → back to Draft
}

message RowResponse {
  PayoutRow row = 1;
}

// ── Publication (spec §4) ─────────────────────────────────────────────────────

message PublicationSettings {
  int32 window_start_hour = 1; // Kyiv local, inclusive
  int32 window_end_hour = 2;   // Kyiv local, exclusive
  repeated int32 weekdays = 3; // chrono Mon=0..Sun=6; default [0,1,2,3,4]
  int32 retry_max_attempts = 4;
  int32 retry_backoff_secs = 5;
  bool is_paused = 6;
  optional string changed_by = 7;
  int64 updated_at = 8; // unix micros
}

message GetPublicationSettingsResponse {
  PublicationSettings settings = 1;
}

message SavePublicationSettingsRequest {
  int32 window_start_hour = 1;
  int32 window_end_hour = 2;
  repeated int32 weekdays = 3;
  int32 retry_max_attempts = 4;
  int32 retry_backoff_secs = 5;
  string changed_by = 6;
}

message SetPublicationPausedRequest {
  bool paused = 1;
  string changed_by = 2;
}

message RetryRowRequest {
  string row_id = 1;
  string requested_by = 2;
}

message PublishRowNowRequest {
  string row_id = 1;
  string requested_by = 2;
}
