syntax = "proto3";
import "google/protobuf/empty.proto";
package marketing;

// ─────────────────────────────────────────────────────────────────────────────
// "Predict the market" quiz (London Expo) — PROP25-2459
// One row per completed quiz attempt. The client is already authenticated when
// finishing the quiz, so ClientId is set from the session token at the REST
// facade, not sent by the browser.
// ─────────────────────────────────────────────────────────────────────────────

message QuizResultModel {
    string ClientId = 1;
    // Number of correct answers in this attempt.
    int32 NumberOfCorrectAnswers = 2;
    // Quiz start — when the first question was shown after authentication (unix microseconds).
    int64 StartDate = 3;
    // Quiz end — when the button on the last question was clicked (unix microseconds).
    int64 EndDate = 4;
    // Duration in microseconds, computed server-side as EndDate - StartDate.
    int64 DurationMicros = 5;
}

// SAVE
message SaveQuizResultRequest {
    string ClientId = 1;
    int32 NumberOfCorrectAnswers = 2;
    int64 StartDate = 3;
    int64 EndDate = 4;
}

message SaveQuizResultResponse {
    // Id of the stored attempt row.
    string Id = 1;
}

// GET (paginated report — Backoffice)
// Ordering is fixed by the ticket and applied server-side:
//   1) NumberOfCorrectAnswers DESC (primary)
//   2) DurationMicros ASC          (secondary)
//   3) StartDate ASC               (tie-breaker)
message GetPaginatedQuizResultsRequest {
    uint64 Limit = 1;
    uint64 Offset = 2;
}

message GetPaginatedQuizResultsResponse {
    repeated marketing.QuizResultModel Items = 1;
    uint64 Total = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Surveys — PROP25-2626
// Reusable surveys shown to the client in a modal on Home. Operators create and
// configure them in back-office. A survey has one or more questions, each with
// two or more options; the client picks exactly one option per question.
//
// Titles, questions and options carry translation keys only (the site
// dictionary, BO Language page). The backend identifies everything by id;
// keys are for the frontend to look texts up. Keys and structure are locked
// after create, only settings (max shows, period, active) can change.
//
// A survey is shown to a client while it is Active, the client has not answered
// it and it was shown fewer than MaxShows times.
// ─────────────────────────────────────────────────────────────────────────────

// Computed by the backend from IsActive and the period. Disabled takes
// precedence over the period-based statuses.
enum SurveyStatus {
    SurveyStatusUnknown = 0;
    // IsActive and now is within [StartsAt, EndsAt] — shown to clients.
    SurveyStatusActive = 1;
    // IsActive, StartsAt is in the future.
    SurveyStatusScheduled = 2;
    // EndsAt is in the past.
    SurveyStatusExpired = 3;
    // IsActive = false.
    SurveyStatusDisabled = 4;
}

message SurveyOptionModel {
    string Id = 1;
    string OptionKey = 2;
}

message SurveyQuestionModel {
    string Id = 1;
    string QuestionKey = 2;
    // In display order.
    repeated marketing.SurveyOptionModel Options = 3;
}

// Survey as the client sees it.
message ClientSurveyModel {
    string Id = 1;
    string TitleKey = 2;
    // In display order.
    repeated marketing.SurveyQuestionModel Questions = 3;
}

// Survey as back-office sees it.
message SurveyModel {
    string Id = 1;
    string TitleKey = 2;
    // In display order.
    repeated marketing.SurveyQuestionModel Questions = 3;
    // Limit of shows without an answer.
    int32 MaxShows = 4;
    bool IsActive = 5;
    // Period bounds (unix microseconds). Not set = open bound; both not set = permanent survey.
    optional int64 StartsAt = 6;
    optional int64 EndsAt = 7;
    marketing.SurveyStatus Status = 8;
    int64 CreatedAt = 9;
    int64 UpdatedAt = 10;
}

// CLIENT: surveys to show
message GetClientSurveysRequest {
    string ClientId = 1;
}

message GetClientSurveysResponse {
    repeated marketing.ClientSurveyModel Surveys = 1;
}

// CLIENT: the modal was displayed. Adds one show. Ignored for an unknown,
// non-active or already answered survey.
message MarkSurveyShownRequest {
    string ClientId = 1;
    string SurveyId = 2;
}

// CLIENT: answers to every question of the survey, sent once. First answer
// wins, a repeated call is ignored. Invalid input → INVALID_ARGUMENT whose
// message lists every problem, one per line.
message SurveyAnswerModel {
    string QuestionId = 1;
    string OptionId = 2;
}

message SaveSurveyAnswersRequest {
    string ClientId = 1;
    string SurveyId = 2;
    repeated marketing.SurveyAnswerModel Answers = 3;
}

// BO: all surveys
message GetSurveysResponse {
    repeated marketing.SurveyModel Surveys = 1;
}

// BO: create. Ids are generated by the backend; questions and options are
// stored in the order sent. Invalid input → INVALID_ARGUMENT.
message CreateSurveyOptionModel {
    string OptionKey = 1;
}

message CreateSurveyQuestionModel {
    string QuestionKey = 1;
    repeated marketing.CreateSurveyOptionModel Options = 2;
}

message CreateSurveyRequest {
    string TitleKey = 1;
    repeated marketing.CreateSurveyQuestionModel Questions = 2;
    int32 MaxShows = 3;
    bool IsActive = 4;
    optional int64 StartsAt = 5;
    optional int64 EndsAt = 6;
}

message CreateSurveyResponse {
    marketing.SurveyModel Survey = 1;
}

// BO: settings only, the structure is locked. Every field is written as sent
// (an unset StartsAt/EndsAt clears that bound). Unknown survey → NOT_FOUND,
// invalid input → INVALID_ARGUMENT.
message UpdateSurveySettingsRequest {
    string SurveyId = 1;
    int32 MaxShows = 2;
    bool IsActive = 3;
    optional int64 StartsAt = 4;
    optional int64 EndsAt = 5;
}

message UpdateSurveySettingsResponse {
    marketing.SurveyModel Survey = 1;
}

service MarketingFlowsGrpcService {
    rpc SaveQuizResult(marketing.SaveQuizResultRequest) returns (marketing.SaveQuizResultResponse);
    rpc GetPaginatedQuizResults(marketing.GetPaginatedQuizResultsRequest) returns (marketing.GetPaginatedQuizResultsResponse);
    // Surveys — client side (called by personal-data-rest-api)
    rpc GetClientSurveys(marketing.GetClientSurveysRequest) returns (marketing.GetClientSurveysResponse);
    rpc MarkSurveyShown(marketing.MarkSurveyShownRequest) returns (google.protobuf.Empty);
    rpc SaveSurveyAnswers(marketing.SaveSurveyAnswersRequest) returns (google.protobuf.Empty);
    // Surveys — back-office
    rpc GetSurveys(google.protobuf.Empty) returns (marketing.GetSurveysResponse);
    rpc CreateSurvey(marketing.CreateSurveyRequest) returns (marketing.CreateSurveyResponse);
    rpc UpdateSurveySettings(marketing.UpdateSurveySettingsRequest) returns (marketing.UpdateSurveySettingsResponse);
    rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
