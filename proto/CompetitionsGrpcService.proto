syntax = "proto3";
package competitions;
import "google/protobuf/empty.proto";

enum CompetitionStatus {
  Draft = 0;
  RegistrationOpen = 1;
  Active = 2;
  Ended = 3;
}

// Whether the caller is registered for a competition. Orthogonal to
// ActivationState: a trader joins (Enrolled), then separately activates their
// trading account (PROP25-2582). Values prefixed because proto3 enum values share
// the package namespace.
enum EnrollmentStatus {
  EnrollmentNotEnrolled = 0;
  EnrollmentEnrolled = 1;
}

// State of the caller's competition trading account (PROP25-2582). Orthogonal to
// EnrollmentStatus. The account is created on demand when the trader clicks
// "Activate account" (not automatically): NotActive (no account yet) -> Pending
// (order placed, account being created) -> Active (account ready).
enum ActivationState {
  ActivationNotActive = 0;
  ActivationPending = 1;
  ActivationActive = 2;
}

// Participant category a competition may be restricted to (PROP25-2582). BO
// multi-selects any subset; empty = open to everyone. A trader falls into exactly
// one category, resolved at Join from registration date / paid orders / prior
// accounts. NEVER exposed to the client — carried only inside CompetitionManagement
// (which the public facade never fills). Opaque codes, like platform ids.
enum ParticipantCategory {
  // Registered on/after the calendar day of registration_opens_at (by reg date
  // alone — a same-day buyer still counts).
  NewlyRegistered = 0;
  // Registered earlier; no paid orders; never had any trading account.
  UnpaidNoAccount = 1;
  // Registered earlier; no paid orders; has/had >=1 trading account (manual grant,
  // free reward, earlier competition, any route).
  UnpaidWithAccount = 2;
  // Registered earlier; >=1 paid order (zero-price grants do not count).
  Paid = 3;
}

// The caller's own result in a competition (rank/profit on the leaderboard).
// Present inside CallerContext only once the account is Active — rank/profit_pct
// are absent for a disqualified participant (shown as a dash).
message MyCompetitionResult {
  optional int32 rank = 1;        // null for DQ
  optional double profit_pct = 2; // null for DQ (dash)
  bool is_disqualified = 3;
}

// Per-caller enrichment on a competition (list/detail), set only when the request
// carries a client_id (authenticated). Absent for anonymous calls / Save. Collapses
// everything that depends on "who is asking" into one optional block.
message CallerContext {
  // Registration state of the caller for this competition.
  competitions.EnrollmentStatus enrollment_status = 1;
  // Trading-account state of the caller for this competition.
  competitions.ActivationState activation_state = 2;
  // Rank/profit — present only when activation_state == Active (has an account on
  // the leaderboard). Absent otherwise.
  optional competitions.MyCompetitionResult my_result = 3;
  // Whether the caller may join (participant-category gate, PROP25-2582). The client
  // learns "available / not available" — never the categories themselves.
  bool is_eligible = 4;
}

// Management-only competition fields — filled on Backoffice reads, NEVER on public
// reads. Kept in its own optional block so the public facade can leave it unset and
// the restricted data (participant categories) can't leak to clients, even though
// Competition is one shared type.
message CompetitionManagement {
  // Participant categories the competition is restricted to. Empty = open to
  // everyone. BO read/write (Save carries the set here).
  repeated competitions.ParticipantCategory participant_categories = 1;
}

message Competition {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string prize_pool_title = 4;
  optional string prize_pool_description = 5;
  optional string prize_distribution_notes = 6;
  optional string prize_disclaimer = 7;
  optional string rules = 8;
  string package_id = 9;
  // Registration limit: how many traders may join. (The "max participants" cap.)
  int32 max_participants = 10;
  int64 registration_opens_at = 11;
  int64 registration_closes_at = 12;
  int64 starts_at = 13;
  int64 ends_at = 14;
  competitions.CompetitionStatus status = 15;
  int64 created_at = 16;
  int64 updated_at = 17;
  // Live count of joined traders (registration slots used).
  int32 enrolled_count = 18;
  // Prize preview shown on both the list card and the detail page (per Figma).
  // Ordered by sort_order, same shape as GetById's prize_tiers. Empty when the
  // competition has no tiers.
  repeated competitions.CompetitionPrizeTier prize_tiers = 19;
  // Trading platforms this competition may issue accounts on (platform_id codes:
  // MT4=0, MT5=1, Cfd=2, Yft=3, CTrader=4, TradeLocker=5). Set by BO on Save;
  // returned on detail (not on the list card). Empty = legacy competition with no
  // explicit platforms — enroll falls back to the default platform.
  repeated int32 platforms = 20;

  // --- PROP25-2582: account limit ---

  // Account limit: how many accounts may be activated (first come, first served).
  // <= max_participants (registration limit). Legacy rows (0) fall back to
  // max_participants. Set by BO. accounts_left = account_limit - account_count is
  // derived by the client (not sent as a field).
  int32 account_limit = 21;
  // Live count of activated accounts (source of truth for the account gate).
  // Service-owned, ignored on Save.
  int32 account_count = 22;

  // Per-caller enrichment — set only when the call is authenticated (client_id
  // given). Absent for anonymous / Save.
  optional competitions.CallerContext caller_context = 23;
  // Management-only fields — filled on BO reads, never on public reads.
  optional competitions.CompetitionManagement management = 24;
}

message CompetitionPrizeTier {
  string id = 1;
  string competition_id = 2;
  string place_label = 3;
  string prize_label = 4;
  int32 sort_order = 5;
}

// One trader's participation in a competition (BO participant list). Renamed from
// CompetitionEnrollment (PROP25-2582): enrollment and activation are now separate,
// so the row carries both states.
message CompetitionParticipation {
  string id = 1;
  string competition_id = 2;
  string client_id = 3;
  // The activated trading account. Empty until the trader activates.
  string trader_account_id = 4;
  double profit_pct = 5;
  bool is_disqualified = 6;
  int64 enrolled_at = 7;
  // When the trader activated their account. 0 if they joined but never activated.
  int64 activated_at = 8;
  // Registration state (every row in this list is Enrolled; kept for symmetry).
  competitions.EnrollmentStatus enrollment_status = 9;
  // Trading-account state: NotActive (joined, not activated), Pending (activating),
  // Active (account ready).
  competitions.ActivationState activation_state = 10;
}

message LeaderboardEntry {
  // rank/profit_pct are optional: DQ entries have neither (shown below ranked
  // positions with a dash). Non-DQ always have both.
  optional int32 rank = 1;
  string client_id = 2;
  string trader_account_id = 3;
  optional double profit_pct = 4;
  bool is_disqualified = 5;
  // Only activated participants appear on the leaderboard (PROP25-2582: join-only
  // traders have no account and no result), so this is the activation time, also
  // the tiebreaker for equal profit (earlier activation ranks higher).
  int64 activated_at = 6;
  // Display fields resolved from personal-data (enriched at build time):
  // "First L." and country of registration.
  string trader_name = 7;
  string country = 8;
  // is_current_user: null (unset) for anonymous calls; set true on the caller's
  // row and false on others when the request is authenticated. Resolved per
  // request at the API layer, not stored in the cache.
  optional bool is_current_user = 9;
}

// --- Competition CRUD ---

message GetPaginatedCompetitionsRequest {
  uint64 limit = 1;
  int64 offset = 2;
  optional competitions.CompetitionStatus status = 3;
  // Set from token at REST facade for authenticated calls; fills each item's
  // caller_context. Empty for anonymous.
  optional string caller_client_id = 4;
  // ?participated=true — return only competitions the caller is enrolled in
  // (requires caller_client_id). Ignored when caller_client_id is empty.
  bool participated_only = 5;
}

message GetPaginatedCompetitionsResponse {
  repeated competitions.Competition items = 1;
  uint64 total = 2;
}

message GetCompetitionByIdRequest {
  string id = 1;
  // Fills the returned competition's caller_context.
  optional string caller_client_id = 2;
}

message GetCompetitionByIdResponse {
  competitions.Competition competition = 1;
  repeated competitions.CompetitionPrizeTier prize_tiers = 2;
}

// --- Client-area reads (distinct types; server excludes Draft) ---
// Same fields as the BO reads, but separate messages so the generated gRPC
// client emits distinct trait impls (reusing the BO types collides). The public
// server never fills Competition.management (categories stay server-side).

message GetPublicCompetitionsRequest {
  uint64 limit = 1;
  int64 offset = 2;
  // Set from the token at the REST facade; fills caller_context.
  optional string caller_client_id = 3;
  // ?participated=true — only the caller's competitions (requires caller_client_id).
  bool participated_only = 4;
}

message GetPublicCompetitionsResponse {
  repeated competitions.Competition items = 1;
  uint64 total = 2;
}

message GetPublicCompetitionByIdRequest {
  string id = 1;
  optional string caller_client_id = 2;
}

message GetPublicCompetitionByIdResponse {
  competitions.Competition competition = 1;
  repeated competitions.CompetitionPrizeTier prize_tiers = 2;
}

message SaveCompetitionRequest {
  competitions.Competition competition = 1;
  repeated competitions.CompetitionPrizeTier prize_tiers = 2;
}

message SaveCompetitionResponse {
  competitions.Competition competition = 1;
  repeated competitions.CompetitionPrizeTier prize_tiers = 2;
}

message DeleteCompetitionRequest {
  string id = 1;
}

message SetCompetitionStatusRequest {
  string id = 1;
  competitions.CompetitionStatus status = 2;
}

message SetCompetitionStatusResponse {
  competitions.Competition competition = 1;
}

// --- Participants (Backoffice participant list) ---

message GetParticipationsRequest {
  string competition_id = 1;
  uint64 limit = 2;
  int64 offset = 3;
}

message GetParticipationsResponse {
  repeated competitions.CompetitionParticipation participations = 1;
  uint64 total = 2;
}

message EnrollClientRequest {
  string competition_id = 1;
  string client_id = 2;
  // Brand comes from the request context at the REST facade (get_brand_id),
  // like client_id — the internal gRPC call must receive it explicitly to
  // create the trader-account order under the right brand.
  string brand = 3;
  // Platform the trader account is created on (platform_id code). Optional: the
  // client UI does not send it yet, so when absent the service uses the default
  // platform (CTrader). When present it must be one of the competition's
  // `platforms`.
  optional int32 platform_id = 4;
}

message EnrollClientResponse {
  competitions.CompetitionParticipation participation = 1;
}

// --- My participation (client area: GET /competitions/:id/my-enrollment) ---

message GetMyParticipationRequest {
  string competition_id = 1;
  string client_id = 2;
}

// Present only once the account is Active. rank/profit_pct are absent for a
// disqualified participant.
message MyParticipationResult {
  string trader_account_id = 1;
  // When the trader activated their account.
  int64 activated_at = 2;
  optional int32 rank = 3;
  optional double profit_pct = 4;
  bool is_disqualified = 5;
  // Participants on the leaderboard (= activated accounts, account_count) — for
  // "#7 of N". Join-only traders are not counted (PROP25-2582).
  int32 total_participants = 6;
}

message GetMyParticipationResponse {
  // Registration state: NotEnrolled / Enrolled.
  competitions.EnrollmentStatus enrollment_status = 1;
  // Trading-account state: NotActive / Pending / Active. The client renders the
  // Figma card from (enrollment_status, activation_state) + the competition window
  // and accounts_left; this survives reload because it is read from the DB.
  competitions.ActivationState activation_state = 2;
  // 0 when the caller is not enrolled.
  int64 enrolled_at = 3;
  // Present only when activation_state == Active.
  optional competitions.MyParticipationResult active_result = 4;
}

// --- Account activation (PROP25-2582, client area: POST /competitions/:id/activate) ---

message ActivateAccountRequest {
  string competition_id = 1;
  string client_id = 2;
}

// Success: activation_state is Pending (order placed now, or already in progress)
// or Active (the trader already had an account). The "can't activate" reasons
// (not started / ended / all accounts claimed / not enrolled) come back as a gRPC
// status with a machine-readable message prefix, mapped to REST codes at the facade
// — the same pattern as Enroll — not as enum values here.
message ActivateAccountResponse {
  competitions.ActivationState activation_state = 1;
}

// --- Leaderboard ---

message GetLeaderboardRequest {
  string competition_id = 1;
  uint64 limit = 2;
  int64 offset = 3;
  // Set from the token at the REST facade for authenticated calls; empty for
  // anonymous. Used to mark the caller's row (is_current_user) — resolved per
  // request, not stored in the cache.
  optional string caller_client_id = 4;
}

message GetLeaderboardResponse {
  repeated competitions.LeaderboardEntry entries = 1;
  uint64 total = 2;
}

service CompetitionsGrpcService {
  // Competition management (Backoffice — sees every status, incl. Draft)
  rpc GetPaginated(competitions.GetPaginatedCompetitionsRequest) returns (competitions.GetPaginatedCompetitionsResponse);
  rpc GetById(competitions.GetCompetitionByIdRequest) returns (competitions.GetCompetitionByIdResponse);
  rpc Save(competitions.SaveCompetitionRequest) returns (competitions.SaveCompetitionResponse);
  rpc Delete(competitions.DeleteCompetitionRequest) returns (google.protobuf.Empty);
  rpc SetStatus(competitions.SetCompetitionStatusRequest) returns (competitions.SetCompetitionStatusResponse);

  // Client area (REST facade) — NEVER returns Draft. Distinct request/response
  // types (not reused from the BO reads) so the generated client emits separate
  // trait impls; the server excludes Draft.
  rpc GetPublicCompetitions(competitions.GetPublicCompetitionsRequest) returns (competitions.GetPublicCompetitionsResponse);
  rpc GetPublicCompetitionById(competitions.GetPublicCompetitionByIdRequest) returns (competitions.GetPublicCompetitionByIdResponse);

  // Participation
  rpc GetParticipations(competitions.GetParticipationsRequest) returns (competitions.GetParticipationsResponse);
  rpc Enroll(competitions.EnrollClientRequest) returns (competitions.EnrollClientResponse);
  rpc GetMyParticipation(competitions.GetMyParticipationRequest) returns (competitions.GetMyParticipationResponse);
  // Trader-triggered account creation (PROP25-2582): NotActive -> Pending within
  // starts_at..ends_at, gated by the account limit. Idempotent (repeated clicks /
  // reload never create a second account).
  rpc ActivateAccount(competitions.ActivateAccountRequest) returns (competitions.ActivateAccountResponse);

  // Leaderboard
  rpc GetLeaderboard(competitions.GetLeaderboardRequest) returns (competitions.GetLeaderboardResponse);

  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
