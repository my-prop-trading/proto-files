name: Tag Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail

          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "No tag yet - tag the baseline manually before enabling automatic bumps" >&2
            exit 1
          fi

          subjects=$(git log --format='%s' "$latest..HEAD")
          bodies=$(git log --format='%b' "$latest..HEAD")

          if [ -z "$subjects" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects" || grep -q 'BREAKING CHANGE' <<< "$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
            bump=minor
          else
            bump=patch
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.next.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git tag "${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.version }}"

      - name: Create release
        if: steps.next.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.next.outputs.version }}" \
            --title "${{ steps.next.outputs.version }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.next.outputs.previous }}"
